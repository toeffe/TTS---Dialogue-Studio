<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser TTS chat</title>
<style>
  html, body { margin: 0; background: transparent; color: #F5F5F7; font: 13px/1.4 system-ui, sans-serif; }
  body { padding: 8px 10px; }
  #status { font-family: ui-monospace, Consolas, monospace; font-size: 12px; opacity: 0.8; }
  #last { margin-top: 6px; }
  #controls { display: flex; gap: 8px; }
  button { margin-top: 8px; background: transparent; color: inherit; border: 1px solid rgba(245,245,247,0.35); border-radius: 8px; padding: 4px 10px; }
  #stopLine { color: #FF6961; border-color: rgba(255,105,97,0.7); }
</style>
</head>
<body>
<div id="status">starting</div>
<div id="last"></div>
<div id="controls">
  <button type="button" id="skipLine">Skip</button>
  <button type="button" id="stopLine">Stop</button>
</div>
<button type="button" id="sound" hidden>Allow sound</button>
<script>
const statusEl = document.getElementById('status');
const lastEl = document.getElementById('last');
const soundBtn = document.getElementById('sound');
const queue = [];
let channel = '';
let speaking = false;
let currentAudio = null;
let speakAbort = null;
let stopNow = false;
let skipNow = false;
let playingLabel = '';
let socket = null;
let reconnectTimer = null;

const VOICE_ALIASES = {
  heart: 'af_heart', af_heart: 'af_heart',
  isabella: 'bf_isabella', bella: 'bf_isabella', bf_isabella: 'bf_isabella',
  puck: 'am_puck', am_puck: 'am_puck',
  fable: 'bm_fable', bm_fable: 'bm_fable',
  alpha: 'hf_alpha', hf_alpha: 'hf_alpha',
  omega: 'hm_omega', hm_omega: 'hm_omega',
  siwis: 'ff_siwis', ff_siwis: 'ff_siwis',
  alex: 'em_alex', em_alex: 'em_alex',
};
const VOICE_SAY = {
  af_heart: 'Heart', bf_isabella: 'Isabella', am_puck: 'Puck', bm_fable: 'Fable',
  hf_alpha: 'Alpha', hm_omega: 'Omega', ff_siwis: 'Siwis', em_alex: 'Alex',
};
function setStatus(text) { statusEl.textContent = text; }

function unescapeTag(value) {
  return String(value || '').replace(/\\([sn:\\r])/g, (_, c) => ({s:' ', n:' ', ':':';', '\\':'\\', r:' '}[c] || c));
}

function playBlob(blob) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    let settled = false;
    const done = () => {
      if (settled) return;
      settled = true;
      if (currentAudio === audio) currentAudio = null;
      URL.revokeObjectURL(url);
      resolve();
    };
    audio.onended = done;
    audio.onerror = done;
    audio.play().then(() => { soundBtn.hidden = true; }).catch(() => {
      soundBtn.hidden = false;
      done();
    });
  });
}

function haltAudio() {
  const audio = currentAudio;
  if (!audio) return;
  audio.pause();
  audio.dispatchEvent(new Event('ended'));
}

function reportQueue() {
  const body = JSON.stringify({playing: playingLabel, queue: queue.map(job => job.label)});
  fetch('/queue', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body
  }).catch(() => {});
}

function requestSkip() {
  skipNow = true;
  if (speakAbort) speakAbort.abort();
  haltAudio();
  setStatus('skipped');
  reportQueue();
}

function requestStop() {
  stopNow = true;
  skipNow = false;
  queue.length = 0;
  if (speakAbort) speakAbort.abort();
  playingLabel = '';
  haltAudio();
  setStatus('stopped');
  reportQueue();
}

async function drain() {
  if (speaking) return;
  speaking = true;
  while (queue.length && !stopNow) {
    const job = queue.shift();
    playingLabel = job.label;
    lastEl.textContent = job.label;
    reportQueue();
    const ctrl = new AbortController();
    speakAbort = ctrl;
    try {
      const response = await fetch('/speak', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: job.text, voice: job.voice}),
        signal: ctrl.signal
      });
      if (stopNow) break;
      if (skipNow) { skipNow = false; continue; }
      if (response.ok) await playBlob(await response.blob());
    } catch { /* aborted or failed; the next line can still play */ }
    finally { if (speakAbort === ctrl) speakAbort = null; }
    if (stopNow) break;
    if (skipNow) skipNow = false;
  }
  if (stopNow) queue.length = 0;
  stopNow = false;
  skipNow = false;
  speaking = false;
  if (!queue.length) {
    playingLabel = '';
    reportQueue();
  }
  if (queue.length) drain();
}

function enqueue(text, voiceId, label) {
  if (queue.length >= 3) queue.shift();
  queue.push({text, voice: voiceId, label: label || text});
  reportQueue();
  drain();
}

function quotedMessage(raw) {
  const text = String(raw || '').trim();
  if (!text) return '';
  const open = text[0];
  if (open === '"' || open === "'" || open === '\u201c') {
    const close = open === '\u201c' ? '\u201d' : open;
    const end = text.indexOf(close, 1);
    if (end === -1) return text.slice(1).trim();
    return text.slice(1, end).trim();
  }
  return text;
}

function ttsRequest(arg) {
  let body = String(arg || '').trim();
  if (body.length >= 2) {
    const open = body[0];
    const close = open === '\u201c' ? '\u201d' : open;
    if ((open === '"' || open === "'" || open === '\u201c') && body.endsWith(close)) {
      body = body.slice(1, -1).trim();
    }
  }
  const colon = body.indexOf(':');
  if (colon <= 0) return null;
  const voiceId = VOICE_ALIASES[body.slice(0, colon).trim().toLowerCase()];
  if (!voiceId) return null;
  let message = quotedMessage(body.slice(colon + 1)).replace(/\s+/g, ' ').trim();
  if (!message) return null;
  if (message.length > 180) message = message.slice(0, 177) + '...';
  return {voice: voiceId, message};
}

function handleLine(raw) {
  const line = raw.trim();
  if (!line) return;
  if (line.startsWith('PING')) {
    socket.send(line.replace('PING', 'PONG'));
    return;
  }
  let rest = line;
  let tags = {};
  if (rest.startsWith('@')) {
    const splitAt = rest.indexOf(' ');
    tags = Object.fromEntries(rest.slice(1, splitAt).split(';').map(piece => {
      const eq = piece.indexOf('=');
      return eq < 0 ? [piece, ''] : [piece.slice(0, eq), piece.slice(eq + 1)];
    }));
    rest = rest.slice(splitAt + 1);
  }
  const match = rest.match(/^:([^! ]+)![^ ]* PRIVMSG #[^ ]+ :(.*)$/);
  if (!match) return;
  let text = match[2];
  if (text.charCodeAt(0) === 1 && text.endsWith('\u0001')) text = text.slice(8, -1);
  text = text.replace(/\s+/g, ' ').trim();
  const command = text.match(/^!([A-Za-z]+)(?:\s+([\s\S]*))?$/);
  if (!command) return;
  const verb = command[1].toLowerCase();
  if (verb !== 'tts') return;
  const request = ttsRequest(command[2] || '');
  if (!request) return;
  const name = unescapeTag(tags['display-name'] || match[1]);
  enqueue(request.message, request.voice, name + ' (' + VOICE_SAY[request.voice] + '): ' + request.message);
}

function connect() {
  if (!channel) { setStatus('Set the channel on Streaming TTS'); return; }
  setStatus('connecting #' + channel);
  socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  socket.onopen = () => {
    socket.send('CAP REQ :twitch.tv/tags');
    socket.send('PASS SCHMOOPIIE');
    socket.send('NICK justinfan' + Math.floor(10000 + Math.random() * 89999));
    socket.send('JOIN #' + channel);
  };
  socket.onmessage = event => {
    for (const piece of String(event.data).split(/\r?\n/)) handleLine(piece);
  };
  socket.onclose = () => {
    setStatus('reconnecting #' + channel);
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 2000);
  };
  socket.onerror = () => socket.close();
}

const joined = new Set();
const origHandle = handleLine;
handleLine = raw => {
  const line = raw.trim();
  if (line.includes(' 366 ') || line.includes(' JOIN #' + channel)) {
    if (!joined.has(channel)) {
      joined.add(channel);
      setStatus('listening #' + channel);
    }
  }
  origHandle(raw);
};

soundBtn.onclick = () => { soundBtn.hidden = true; drain(); };
document.getElementById('skipLine').onclick = requestSkip;
document.getElementById('stopLine').onclick = requestStop;

async function pollControl() {
  try {
    const response = await fetch('/control', {cache: 'no-store'});
    if (!response.ok) return;
    const data = await response.json();
    if (data.action === 'stop') requestStop();
    else if (data.action === 'skip') requestSkip();
  } catch { /* the buttons on this page still work */ }
}
setInterval(pollControl, 300);
setInterval(reportQueue, 2000);

let refreshing = false;
async function refreshChannel() {
  if (refreshing) return;
  refreshing = true;
  try {
    const response = await fetch('/channel', {cache: 'no-store'});
    if (!response.ok) return;
    const next = String((await response.json()).channel || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
    if (next === channel) return;
    channel = next;
    joined.clear();
    clearTimeout(reconnectTimer);
    if (socket) {
      socket.onclose = null;
      socket.close();
      socket = null;
    }
    connect();
  } catch { /* try again on the next check */ }
  finally { refreshing = false; }
}
refreshChannel();
setInterval(refreshChannel, 2000);
</script>
</body>
</html>
